<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calcule seu frete – LFM Transportes</title>
  <meta name="description" content="Calcule na hora o valor da sua entrega em Ponta Grossa e agende pelo WhatsApp.">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

  <!-- ========== CABEÇALHO: logo + nome ========== -->
  <header class="topo">
    <div class="marca">
      <!-- Se o arquivo de logo não existir, aparece a sigla "LFM" no lugar -->
      <img id="logo" class="logo" alt="Logo">
      <div class="logo-reserva" id="logo-reserva" hidden>LFM</div>
      <div>
        <h1 id="nome-empresa">LFM Transportes</h1>
        <p class="subtitulo">Entregas em <span id="nome-cidade">Ponta Grossa-PR</span></p>
      </div>
    </div>
  </header>

  <main class="conteudo">
    <section class="cartao">
      <h2>Calcule o valor da entrega</h2>

      <!-- ========== TIPO DE ENTREGA ========== -->
      <fieldset class="grupo">
        <legend>Tipo de entrega</legend>
        <div class="opcoes" id="opcoes-modalidade">
          <!-- As opções são criadas a partir do config.js -->
        </div>
      </fieldset>

      <!-- ========== DISTÂNCIA (TEMPORÁRIO) ==========
           Na etapa 3/4 isto vira: campos de endereço + cálculo automático da rota. -->
      <fieldset class="grupo provisorio">
        <legend>Distância <span class="etiqueta">teste – será automático</span></legend>

        <label class="campo">
          <span>Quantos km de carro?</span>
          <input id="km" type="text" inputmode="decimal" placeholder="Ex.: 4,5" autocomplete="off">
        </label>

        <div class="opcoes opcoes-dupla">
          <label class="opcao"><input type="radio" name="local" value="dentro" checked><span>Dentro de PG</span></label>
          <label class="opcao"><input type="radio" name="local" value="fora"><span>Fora de PG</span></label>
        </div>
      </fieldset>

      <!-- ========== CARGA ESPECIAL (só aparece se ativada no config) ========== -->
      <label class="marcar" id="bloco-especial" hidden>
        <input id="especial" type="checkbox">
        <span id="rotulo-especial">Carga especial</span>
      </label>

      <!-- ========== RESULTADO ========== -->
      <div class="resultado" id="resultado" aria-live="polite">
        <p class="resultado-vazio" id="resultado-vazio">Preencha a distância para ver o valor.</p>
        <div id="resultado-cheio" hidden>
          <p class="resultado-rotulo">Valor da entrega</p>
          <p class="resultado-valor" id="valor">R$ 0,00</p>
          <p class="resultado-detalhe" id="detalhe"></p>
        </div>
        <p class="erro" id="erro" hidden></p>
      </div>
    </section>

    <p class="rodape">Nenhum dado pessoal é guardado nesta página.</p>
  </main>

  <!-- A ordem importa: primeiro a tabela, depois as contas, por último a tela -->
  <script src="config.js"></script>
  <script src="parceiros.js"></script>
  <script src="js/parceiro.js"></script>
  <script src="js/precos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
